<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="710" viewBox="0 0 1040 710" role="img" aria-labelledby="title desc">
<title id="title">Web Experience Standard monitoring layout</title>
<desc id="desc">Proposed dashboard sections with native product links. No live data.</desc>
<rect width="1040" height="710" rx="20" fill="#f5f4fa"/>
<g font-family="Arial, sans-serif">
<rect x="24" y="24" width="992" height="86" rx="12" fill="#30234d"/>
<text x="46" y="59" fill="#fff" font-size="24" font-weight="700">Web Experience Standard</text>
<text x="46" y="87" fill="#dfd3f3" font-size="15">Application · environment · release · view · device · journey · time window</text>
<rect x="24" y="126" width="992" height="58" rx="10" fill="#e8e0f4"/>
<text x="44" y="150" fill="#412866" font-size="16" font-weight="700">DATA CONFIDENCE</text>
<text x="44" y="173" fill="#412866" font-size="14">Coverage · sample counts · consent · retained versus full traffic · last intake</text>
<g fill="#fff" stroke="#ded9e8">
<rect x="24" y="202" width="314" height="100" rx="10"/><rect x="354" y="202" width="314" height="100" rx="10"/><rect x="684" y="202" width="332" height="100" rx="10"/>
<rect x="24" y="320" width="488" height="136" rx="10"/><rect x="528" y="320" width="488" height="136" rx="10"/>
<rect x="24" y="474" width="314" height="114" rx="10"/><rect x="354" y="474" width="314" height="114" rx="10"/><rect x="684" y="474" width="332" height="114" rx="10"/>
</g>
<g fill="#352744" font-size="18" font-weight="700">
<text x="44" y="232">Experience</text><text x="374" y="232">Performance</text><text x="704" y="232">Business outcomes</text>
<text x="44" y="350">Session intelligence</text><text x="548" y="350">UX hotspots</text>
<text x="44" y="504">Errors and network</text><text x="374" y="504">Product journeys</text><text x="704" y="504">Releases and flags</text>
</g>
<g fill="#635870" font-size="14">
<text x="44" y="259">Affected-session rates</text><text x="44" y="280">Eligible volume and trends</text>
<text x="374" y="259">p75 LCP · INP · CLS</text><text x="374" y="280">Mobile / desktop cohorts</text>
<text x="704" y="259">Confirmed journey completion</text><text x="704" y="280">Failure and drop-off evidence</text>
<text x="44" y="380">Native replay summaries and chapters ↗</text><text x="44" y="403">Representative playlists and timestamps ↗</text><text x="44" y="426">Observed outcome · confidence · owner</text>
<text x="548" y="380">Affected sessions by view / action</text><text x="548" y="403">Click · scroll · top-element maps ↗</text><text x="548" y="426">Baseline · denominator · Watchdog evidence ↗</text>
<text x="44" y="532">Issues · resource failures</text><text x="44" y="555">Logs / APM / source maps ↗</text>
<text x="374" y="532">Funnels · pathways · cohorts ↗</text><text x="374" y="555">Adoption and retention ↗</text>
<text x="704" y="532">Comparable cohort baseline</text><text x="704" y="555">Association, not causal proof</text>
</g>
<rect x="24" y="606" width="992" height="62" rx="10" fill="#e8efe9"/>
<text x="44" y="633" fill="#275039" font-size="17" font-weight="700">RESPONSE</text>
<text x="44" y="656" fill="#275039" font-size="14">Owner · monitor controls · evidence links · diagnostic step · prioritized backlog</text>
<text x="24" y="694" fill="#74677e" font-size="12">Design specification only. ↗ opens a native product view; availability and embedding vary by tenant.</text>
</g></svg>
